version: '3.4'

services:
  # MongoDB database service
  mongodb:
    image: mongo:7.0
    container_name: mongodb-dev
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword123
      - MONGO_INITDB_DATABASE=sensor_monitoring_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dev-network

  # Backend API service with hot-reloading
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: backend-dev
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://admin:devpassword123@mongodb:27017/sensor_monitoring_dev?authSource=admin
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reloading
      - ./backend/src:/app/src:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/package.json:/app/package.json:ro
      # Preserve node_modules in container
      - backend_node_modules:/app/node_modules
      # Mount data directory if needed for development
      - ./backend/data:/app/data
    command: npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - dev-network

  # Frontend web service with hot-reloading
  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      target: development
    container_name: frontend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reloading
      - ./frontEnd/src:/app/src:ro
      - ./frontEnd/public:/app/public:ro
      - ./frontEnd/index.html:/app/index.html:ro
      - ./frontEnd/vite.config.ts:/app/vite.config.ts:ro
      - ./frontEnd/tsconfig.json:/app/tsconfig.json:ro
      - ./frontEnd/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontEnd/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontEnd/tailwind.config.cjs:/app/tailwind.config.cjs:ro
      - ./frontEnd/postcss.config.cjs:/app/postcss.config.cjs:ro
      - ./frontEnd/package.json:/app/package.json:ro
      # Preserve node_modules in container
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - dev-network

volumes:
  backend_node_modules:
  frontend_node_modules:
  mongodb_data:
  mongodb_config:

networks:
  dev-network:
    driver: bridge
