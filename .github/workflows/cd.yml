name: CD - Build & Deploy to Azure

on:
  push:
    branches: [main]
    # Remove the path filter below when ready to deploy
    paths-ignore:
      - '**'  # Temporarily disabled until Azure is configured

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}        # e.g. myapp.azurecr.io
  BACKEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/backend
  FRONTEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontEnd
          file: ./frontEnd/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /opt/app

            # Pull latest compose file
            git pull origin main

            # Log in to ACR
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} --password-stdin

            # Set image tags for this deployment
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

            # Deploy with zero-downtime rolling update
            docker compose -f docker-compose.prod.azure.yml pull
            docker compose -f docker-compose.prod.azure.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f
